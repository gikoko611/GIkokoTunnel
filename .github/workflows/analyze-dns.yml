name: Analyze Hamara DNS Components

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download JADX
        run: |
          curl -fL --retry 3 \
            https://github.com/skylot/jadx/releases/download/v1.5.2/jadx-1.5.2.zip \
            -o /tmp/jadx.zip
          mkdir -p /tmp/jadx
          unzip -q /tmp/jadx.zip -d /tmp/jadx

      - name: Analyze DNS-related code
        run: |
          set -eu
          mkdir -p reports
          JADX_BIN="$(find /tmp/jadx -type f -path '*/bin/jadx' -print -quit)"
          if [ -z "$JADX_BIN" ]; then
            echo "ERROR: JADX executable not found after extraction"
            find /tmp/jadx -maxdepth 4 -type f | head -80
            exit 1
          fi

          chmod +x "$JADX_BIN"
          "$JADX_BIN" --version
          "$JADX_BIN" --help > /tmp/jadx-help.txt
          echo "===== JADX INPUT OPTIONS ====="
          grep -i -A3 -B2 -E 'input|dex|exclude|skip' /tmp/jadx-help.txt | head -100

          # Analyze normal DEX files individually, excluding the malformed
          # obfuscated asset DEX. Continue when a secondary DEX has issues.
          mkdir -p /tmp/hamara-src
          unzip -Z1 input/original.apk |
            grep -E '^(classes[0-9]*\.dex)$' |
            while IFS= read -r dex; do
              echo "===== ANALYZING $dex ====="
              mkdir -p "/tmp/dex-$(basename "$dex" .dex)"
              unzip -p input/original.apk "$dex" > "/tmp/$dex"
              "$JADX_BIN" --no-res --show-bad-code \
                -d "/tmp/dex-$(basename "$dex" .dex)" \
                "/tmp/$dex" || echo "WARNING: JADX could not fully analyze $dex"
            done

          find /tmp/dex-classes* -type f -name '*.java' -exec grep -niE \
            'fastdns|superdns|dnslite|DNSLiteService|SocksDNSService|TunnelVpnService|nameserver|dns.?tunnel' \
            {} + > reports/dns-references.txt || true

          grep -RniE \
            'fastdns|superdns|dnslite|DNSLiteService|SocksDNSService|TunnelVpnService|nameserver|dns.?tunnel' \
            /tmp/hamara-src \
            --include='*.java' \
            > reports/dns-references.txt || true

          echo "===== DNS REFERENCES ====="
          head -300 reports/dns-references.txt

          echo "===== REPORT SUMMARY ====="
          wc -l reports/dns-references.txt

      - name: Upload analysis report
        uses: actions/upload-artifact@v4
        with:
          name: hamara-dns-analysis
          path: reports/dns-references.txt
